name: Build Android debug APK

# Builds the padel camera Android app on every push touching mobile/android/, and
# uploads a debug APK as a workflow artifact. Debug builds are self-signed
# automatically by the Android Gradle Plugin (a throwaway debug keystore, generated
# on the fly) - no Apple-style paid signing account needed, and the resulting APK can
# be sideloaded directly onto a phone with no expiry.
on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/PadelCameraApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: padel-camera-app-debug
          path: mobile/android/PadelCameraApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
